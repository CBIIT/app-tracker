name: Accessibility Tests

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  accessibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    strategy:
      matrix:
        node-version: [16.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run accessibility tests (strict mode)
        run: npm run test:a11y

      - name: Comment PR with accessibility status
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const jobStatus = '${{ job.status }}';
            const badge = jobStatus === 'success' ? '✅ PASS' : '❌ FAIL';
            const color = jobStatus === 'success' ? 'brightgreen' : 'red';
            const comment = `## Accessibility Tests ${badge}\n\nAll Section 508 and WCAG 2.0 Level A accessibility tests have been ${jobStatus === 'success' ? 'passed' : 'failed'}.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });


